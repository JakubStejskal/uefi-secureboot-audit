name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          # PSGallery occasionally answers "No match was found"; retry before failing.
          for ($i = 1; $i -le 3; $i++) {
              try {
                  Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
                  break
              } catch {
                  if ($i -eq 3) { throw }
                  Write-Host "Install-Module failed (attempt $i): $($_.Exception.Message)"
                  Start-Sleep -Seconds (10 * $i)
              }
          }

      - name: Parse check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path ./scripts -Filter *.ps1 | ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $failed = $true
                  Write-Host "::error file=$($_.Name)::Parse errors"
                  $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
              } else {
                  Write-Host "OK  $($_.Name)"
              }
          }
          if ($failed) { exit 1 }

      - name: Analyze
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Severity Error,Warning `
                 -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host }
          if ($r | Where-Object Severity -eq 'Error') { exit 1 }
